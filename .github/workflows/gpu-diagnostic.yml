name: Isolated GPU canvas diagnostic
on:
  push:
    branches: [qa/nr-canvas-diagnostic]
permissions:
  contents: read
jobs:
  canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: python -m pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: Exercise trusted synthetic canvas on software backends
        env:
          DEBUG: pw:browser
        run: |
          mkdir -p artifacts
          cat > /tmp/canvas-probe.py <<'PY'
          import json, threading
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from playwright.sync_api import sync_playwright
          class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
              self.send_response(200);self.send_header('Content-Type','text/html');self.end_headers();self.wfile.write(b'<!doctype html><title>Trusted GPU fixture</title>')
            def log_message(self,*args): pass
          server=ThreadingHTTPServer(('127.0.0.1',4190),Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          common=['--no-sandbox','--enable-unsafe-webgpu','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader']
          cases=[
            ('shared-vulkan',True,['--enable-features=Vulkan,VulkanFromANGLE','--use-vulkan=swiftshader','--disable-vulkan-surface']),
            ('shared-vulkan-default',True,['--enable-features=Vulkan,VulkanFromANGLE']),
            ('headed-shared-vulkan',False,['--enable-features=Vulkan,VulkanFromANGLE','--use-vulkan=swiftshader']),
          ]
          results=[]
          with sync_playwright() as p:
            for name,headless,args in cases:
              browser=None;messages=[]
              try:
                browser=p.chromium.launch(headless=headless,channel='chromium',args=common+args)
                page=browser.new_page();page.on('console',lambda m:messages.append(m.text));page.goto('http://127.0.0.1:4190')
                result=page.evaluate('''async () => await Promise.race([
                  (async()=>{const a=await navigator.gpu.requestAdapter();if(!a)throw Error('No adapter');
                    const d=await a.requestDevice();d.addEventListener('uncapturederror',e=>console.error(e.error.message));d.pushErrorScope('validation');
                    const c=document.createElement('canvas');c.width=64;c.height=48;document.body.append(c);
                    const x=c.getContext('webgpu'),format=navigator.gpu.getPreferredCanvasFormat();x.configure({device:d,format,usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC});
                    const t=x.getCurrentTexture(), rb=d.createBuffer({size:256,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
                    const e=d.createCommandEncoder();const pass=e.beginRenderPass({colorAttachments:[{view:t.createView(),loadOp:'clear',storeOp:'store',clearValue:{r:1,g:0,b:0,a:1}}]});pass.end();
                    e.copyTextureToBuffer({texture:t},{buffer:rb,bytesPerRow:256},[1,1]);d.queue.submit([e.finish()]);
                    const read=()=>{const q=document.createElement('canvas');q.width=64;q.height=48;const y=q.getContext('2d');y.drawImage(c,0,0);return Array.from(y.getImageData(0,0,1,1).data);};
                    const immediate=read();await d.queue.onSubmittedWorkDone();const later=read();
                    await rb.mapAsync(GPUMapMode.READ);const gpuBytes=Array.from(new Uint8Array(rb.getMappedRange()).slice(0,4));rb.unmap();
                    const error=await d.popErrorScope();x.unconfigure();rb.destroy();d.destroy();
                    return {immediate,later,gpuBytes,format,error:error?.message||null,adapter:{vendor:a.info.vendor,architecture:a.info.architecture,description:a.info.description}};})(),
                  new Promise((_,reject)=>setTimeout(()=>reject(Error('GPU timeout')),10000))])''')
                results.append({'name':name,'headless':headless,'args':common+args,'result':result,'messages':messages})
              except Exception as error:results.append({'name':name,'error':str(error),'messages':messages})
              finally:
                if browser:browser.close()
              print(json.dumps(results[-1]),flush=True)
          server.shutdown()
          open('artifacts/canvas-backends.json','w').write(json.dumps(results,indent=2))
          PY
          xvfb-run -a python /tmp/canvas-probe.py > artifacts/canvas-probe.log 2>&1
          cat artifacts/canvas-backends.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canvas-diagnostic
          path: artifacts/
