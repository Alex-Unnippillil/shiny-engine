name: Publish verified player release
on:
  workflow_run:
    workflows: [VLC desktop player, Native Windows, Browser and package]
    types: [completed]
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: player-release-v0.6.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify latest required checks on the exact main revision
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GH_REPO/commits/$RELEASE_SHA/check-runs?per_page=100" > /tmp/checks.json
          python - <<'PY'
          import json, os
          checks=json.load(open('/tmp/checks.json'))['check_runs']
          required={'browser-build','windows-build','vlc-player'}
          latest={}
          for check in sorted(checks,key=lambda c:c['id']):
            if check['head_sha']==os.environ['RELEASE_SHA'] and check['name'] in required:
              latest[check['name']]=check
          ready=required<=latest.keys() and all(c['status']=='completed' and c['conclusion']=='success' for c in latest.values())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('ready='+str(ready).lower()+'\n')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish exact tested installers and checksums
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(node -p "require('./package.json').version")" == '0.6.0' ]]
          if gh release view v0.6.0 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite versioned artifacts.'
            exit 0
          fi
          gh api "repos/$GH_REPO/actions/runs?head_sha=$RELEASE_SHA&event=push&per_page=100" > /tmp/runs.json
          RUN=$(python - <<'PY'
          import json
          runs=json.load(open('/tmp/runs.json'))['workflow_runs']
          valid=[r['id'] for r in runs if r['name']=='VLC desktop player' and r['head_branch']=='main' and r['conclusion']=='success']
          assert valid, 'No successful exact-main native artifact'
          print(max(valid))
          PY
          )
          gh run download "$RUN" --name vlc-player-and-evidence --dir release-assets
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          printf '\nValidated main commit: `%s`\n' "$RELEASE_SHA" >> docs/release-0.6.md
          gh release create v0.6.0 --target "$RELEASE_SHA" --prerelease --title 'Shiny Player 0.6.0 — native NR research and Windows setup' --notes-file docs/release-0.6.md release-assets/*.exe release-assets/*.zip release-assets/SHA256SUMS.txt release-assets/installer-report.json release-assets/playback-report.json
