name: Publish verified player release
on:
  workflow_run:
    workflows: [VLC desktop player, Native Windows, Browser and package, VLC library audit]
    types: [completed]
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: player-release-v0.10.0
  cancel-in-progress: false
jobs:
  publish:
    # Explicit documentation-only merges can skip publication, never validation.
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.id == github.event.repository.id && !contains(github.event.workflow_run.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Reject an obsolete main event before checkout
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          CURRENT_MAIN=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$CURRENT_MAIN" == "$RELEASE_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: steps.gate.outputs.current == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify exact runs, archive digest, package provenance and every published asset
        if: steps.gate.outputs.current == 'true'
        run: python scripts/release_player.py
