name: VLC desktop player
on:
  push:
    branches: [main, 'release/**', feat/vlc-desktop-player, feat/native-nr-player-installers, feat/research-model-playback-0.7]
  pull_request:
permissions:
  contents: read
jobs:
  vlc-player:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: videolan/vlc
          ref: 6de05adcbaf2e8b85fe86aad4169393098628119
          path: .deps/vlc-source
          sparse-checkout: include/vlc
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: maanHimself/OpenDLSS-NR
          ref: 9d08f4184bbcb9d858e2fb7a7834ec0837a9d2f1
          path: .deps/nr
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: 6802bb4733b63ed5efd3adb308a6c885ef180ea1
          path: .deps/vulkan
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: zeux/volk
          ref: 776893306c5d3b22b6185b5d4a258b81d94572bf
          path: .deps/volk
          persist-credentials: false
      - name: Compile native OpenDLSS graph and kernels (no model data)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/vlc | Out-Null
          Invoke-WebRequest 'https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip' -OutFile .deps/glslang.zip
          if ((Get-FileHash .deps/glslang.zip -Algorithm SHA256).Hash.ToLower() -ne '82bf434e69b9bb4829de7e2b4bc2c5e7a7861e53d66cf75e5cc70f5f694a8d9b') { throw 'Shader compiler hash mismatch' }
          Expand-Archive .deps/glslang.zip .deps/nr/tools/glslang
          & .deps/nr/scripts/build_shaders.ps1 2>&1 | Tee-Object artifacts/vlc/nr-shaders.log
          if ($LASTEXITCODE) { throw 'Native shader build failed' }
          cmake -S native/nr-worker -B build/nr -A x64 "-DNR_SOURCE=$PWD/.deps/nr" "-DVULKAN_HEADERS=$PWD/.deps/vulkan" "-DVOLK_SOURCE=$PWD/.deps/volk" 2>&1 | Tee-Object artifacts/vlc/nr-configure.log
          if ($LASTEXITCODE) { throw 'Native NR configure failed' }
          cmake --build build/nr --config Release --parallel 2>&1 | Tee-Object artifacts/vlc/nr-build.log
          if ($LASTEXITCODE) { throw 'Native NR compile failed' }
          ctest --test-dir build/nr -C Release --output-on-failure 2>&1 | Tee-Object artifacts/vlc/nr-tests.log
          if ($LASTEXITCODE) { throw 'Native protocol tests failed' }
          New-Item -ItemType Directory -Force build/vlc/Release/nr | Out-Null
          Copy-Item build/nr/Release/ShinyNrWorker.exe build/vlc/Release/nr/
          Copy-Item .deps/nr/build/shaders build/vlc/Release/nr/ -Recurse
          Copy-Item .deps/nr/build/ptx build/vlc/Release/nr/ -Recurse
      - name: Verify official VLC runtime for tests only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://download.videolan.org/pub/videolan/vlc/3.0.24/win64/vlc-3.0.24-win64.zip' -OutFile .deps/vlc.zip
          if ((Get-FileHash .deps/vlc.zip -Algorithm SHA256).Hash.ToLower() -ne 'fcf30850371ad10c9373cc4f0f4501e7dee49e3e9ae9f20c72fb2661a1ca6323') { throw 'Official VLC archive hash mismatch' }
          Expand-Archive .deps/vlc.zip .deps/runtime
      - name: Fetch authenticated SQLite source for package management
        run: python scripts/fetch-library-deps.py
      - name: Build and test native player
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/vlc-player/make_fixture.py .deps/fixtures
          if ($LASTEXITCODE) { throw 'Fixture generation failed' }
          $runtime = Join-Path $PWD '.deps/runtime/vlc-3.0.24'
          $headers = Join-Path $PWD '.deps/vlc-source/include'
          $fixture = Join-Path $PWD '.deps/fixtures/moving-original.avi'
          cmake -S native/vlc-player -B build/vlc -A x64 "-DSHINY_SQLITE_SOURCE=$PWD/.deps/sqlite" "-DVLC_INCLUDE_DIR=$headers" "-DVLC_TEST_RUNTIME=$runtime" "-DVLC_TEST_FIXTURE=$fixture" 2>&1 | Tee-Object artifacts/vlc/configure.log
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake --build build/vlc --config Release --parallel 2>&1 | Tee-Object artifacts/vlc/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
          ctest --test-dir build/vlc -C Release --output-on-failure 2>&1 | Tee-Object artifacts/vlc/tests.log
          $tests = $LASTEXITCODE
          Copy-Item build/vlc/playback-report.json artifacts/vlc/ -ErrorAction SilentlyContinue
          Copy-Item build/vlc/managed-playback-report.json artifacts/vlc/ -ErrorAction SilentlyContinue
          Copy-Item build/vlc/vlc-decoded-frame.png artifacts/vlc/ -ErrorAction SilentlyContinue
          if ($tests) { throw 'Real VLC tests failed' }
          $image = Join-Path $PWD 'artifacts/vlc/player-desktop.png'
          $args = @('--vlc-dir', ('"'+$runtime+'"'), '--ui-smoke', ('"'+$fixture+'"'), ('"'+$image+'"'))
          $proc = Start-Process build/vlc/Release/ShinyVlcPlayer.exe -ArgumentList $args -PassThru
          if (-not $proc.WaitForExit(30000)) { $proc.Kill(); throw 'Native UI smoke test timed out' }
          if ($proc.ExitCode -ne 0) { throw 'Native UI smoke test failed' }
          $ui = Get-Content artifacts/vlc/ui-playback.json -Raw | ConvertFrom-Json
          if ($ui.decodedVideoFrames -lt 1 -or $ui.width -lt 1) { throw 'Native UI did not decode video' }
      - name: Exercise cinema, bookmarks, native workbench and teardown
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/vlc-player/ui.ps1 -Executable "$PWD/build/vlc/Release/ShinyVlcPlayer.exe" -Runtime "$PWD/.deps/runtime/vlc-3.0.24" -Fixture "$PWD/.deps/fixtures/moving-original.avi" -Output "$PWD/artifacts/vlc"
      - name: Package player and source notices; compile Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/package/nr | Out-Null
          Copy-Item build/vlc/Release/ShinyVlcPlayer.exe artifacts/package/
          python scripts/package-library-manager.py build/vlc/Release artifacts/package
          if ($LASTEXITCODE) { throw 'Library manager package failed' }
          Copy-Item build/vlc/Release/nr/* artifacts/package/nr/ -Recurse
          Copy-Item native/vlc-player/README.md artifacts/package/
          Copy-Item native/vlc-player/THIRD_PARTY_NOTICES.md artifacts/package/
          Copy-Item docs/native-neural.md artifacts/package/
          Copy-Item docs/research-mode.md artifacts/package/
          Copy-Item LICENSE artifacts/package/
          Copy-Item .deps/vlc-source/COPYING.LIB artifacts/package/LGPL-2.1.txt
          Copy-Item .deps/nr/LICENSE artifacts/package/nr/OpenDLSS-LICENSE.txt
          Copy-Item .deps/nr/NOTICE artifacts/package/nr/OpenDLSS-NOTICE.txt
          Copy-Item .deps/volk/LICENSE.md artifacts/package/nr/volk-LICENSE.txt
          Copy-Item .deps/vulkan/LICENSE.md artifacts/package/nr/Vulkan-Headers-LICENSE.txt
          Get-ChildItem artifacts/package -File -Recurse | Sort-Object FullName | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + [IO.Path]::GetRelativePath((Join-Path $PWD 'artifacts/package'), $_.FullName).Replace('\','/') } | Set-Content artifacts/package/SHA256SUMS.txt
          Compress-Archive artifacts/package/* artifacts/vlc/ShinyPlayer-0.8.0-Windows-x64-Portable.zip
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler unavailable' }
          & $iscc /Qp "/DPackageDir=$PWD/artifacts/package" installers/windows/player.iss 2>&1 | Tee-Object artifacts/vlc/installer-build.log
          if ($LASTEXITCODE) { throw 'Windows installer compile failed' }
          git archive --format=zip -o artifacts/vlc/ShinyPlayer-0.8.0-Source.zip HEAD
          git -C .deps/nr archive --format=zip -o ../../artifacts/vlc/OpenDLSS-NR-Pinned-Source.zip HEAD src shaders scripts LICENSE NOTICE
      - name: Exercise setup, cached verified VLC prerequisite, playback and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./installers/windows/smoke.ps1
      - name: Bind packaged artifacts to this source and workflow attempt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -or $sha -notmatch '^[0-9a-f]{40}$') { throw 'Cannot determine source revision' }
          @{
            schema = 1
            version = '0.8.0'
            source_sha = $sha
            source_tree = (git rev-parse 'HEAD^{tree}').Trim()
            repository = $env:GITHUB_REPOSITORY
            workflow_run_id = [long]$env:GITHUB_RUN_ID
            workflow_run_attempt = [int]$env:GITHUB_RUN_ATTEMPT
            signed = $false
            trained_model_inference = $false
          } | ConvertTo-Json | Set-Content artifacts/vlc/build-info.json
      - name: Release checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem artifacts/vlc -File | Where-Object { $_.Extension -in '.zip', '.exe', '.png', '.json' } | Sort-Object Name | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name } | Set-Content artifacts/vlc/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vlc-player-and-evidence
          path: artifacts/vlc/
          if-no-files-found: error
