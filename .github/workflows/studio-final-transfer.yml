name: Apply verified studio corrections
on:
  push:
    branches: ['feat/video-studio-polish']
permissions:
  contents: write
jobs:
  transfer:
    if: >-
      github.event.head_commit.message == 'chore: transfer exact reviewed studio corrections'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Apply checksum-bound non-workflow files to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/video-studio-polish'
          test "$(git rev-parse HEAD^)" = 'a6bc6ab2881128e7dbfce597f7750856f8f7e310'
          python - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          encoded = ''
          decoder = zlib.decompressobj()
          raw = decoder.decompress(base64.b64decode(encoded, validate=True), 10000)
          assert decoder.eof and not decoder.unused_data and len(raw) == 7419
          assert hashlib.sha256(raw).hexdigest() == 'f65df6ba8ca02d8c870d9f53bcea041f6c03b2be6907b962f2bd39ae6d8e146c'
          rows = json.loads(raw)
          allowed = {'installers/windows/smoke.ps1','native/library-manager/gui.cpp','native/vlc-player/README.md','native/vlc-player/core.hpp','native/vlc-player/playback.cpp','native/vlc-player/player.manifest','native/vlc-player/preview_presenter.hpp','scripts/release_player.py','tests/release/test_release_player.py'}
          assert len(rows) == 9 and {r['path'] for r in rows} == allowed
          for row in rows:
              path = pathlib.Path(row['path'])
              assert path.is_file() and not path.is_symlink()
              old = path.read_bytes()
              assert hashlib.sha256(old).hexdigest() == row['before'], str(path)
              lines = old.decode('utf-8').splitlines(keepends=True)
              last = 0
              for start,end,text in row['changes']:
                  assert type(start) is int and type(end) is int and last <= start <= end <= len(lines) and isinstance(text,str)
                  last = end
              for start,end,text in reversed(row['changes']):
                  lines[start:end] = [text]
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == row['after'], str(path)
              path.write_bytes(new)
          PY
          git add -- installers native scripts tests
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: verify all installed filters and refine studio status and focus'
          git push origin HEAD:refs/heads/feat/video-studio-polish
