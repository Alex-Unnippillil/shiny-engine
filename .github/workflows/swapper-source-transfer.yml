name: Apply reviewed optional swapper source
on:
  push:
    branches: ['feat/optional-dlss-swapper']
permissions:
  contents: write
jobs:
  transfer:
    if: >-
      github.event.head_commit.message == 'chore: transfer reviewed optional swapper source'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Apply checksum-bound source on feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/optional-dlss-swapper'
          test "$(git rev-parse HEAD^)" = 'a7a12949a97129df67a566fbd40f894958cb0211'
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib
          parts = sorted(pathlib.Path('source-transport').iterdir())
          assert [p.name for p in parts] == [f'{i:02}.txt' for i in range(4)]
          assert all(p.is_file() and not p.is_symlink() and p.stat().st_size <= 7500 for p in parts)
          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          assert len(encoded) == 28284
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '6dec3e5d693edf6d1db25407c7653d18673608df8c360a6eaf89eef445e1e7c8'
          decoder = lzma.LZMADecompressor(memlimit=64*1024*1024)
          raw = decoder.decompress(compressed, max_length=100000)
          assert decoder.eof and not decoder.unused_data and len(raw) == 65362
          rows = json.loads(raw)
          assert isinstance(rows, list) and len(rows) == 39
          seen = set()
          for row in rows:
              path = pathlib.Path(row['path'])
              assert not path.is_absolute() and not any(p.startswith('.') or p == '..' for p in path.parts)
              assert path.parts[0] in {'CHANGELOG.md','README.md','docs','installers','native','package.json','package-lock.json','scripts','tests'}
              assert str(path) not in seen and not path.is_symlink()
              seen.add(str(path))
              old = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest() == row['before'], str(path)
              lines = old.decode('utf-8').splitlines(keepends=True)
              last = 0
              for start, end, text in row['changes']:
                  assert type(start) is int and type(end) is int and last <= start <= end <= len(lines) and isinstance(text, str)
                  last = end
              for start, end, text in reversed(row['changes']):
                  lines[start:end] = [text]
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == row['after'], str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
          PY
          git rm -r -- source-transport
          git add -- CHANGELOG.md README.md docs installers native package.json package-lock.json scripts tests
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add opt-in external DLSS 5 Swapper launching'
          git push origin HEAD:refs/heads/feat/optional-dlss-swapper
