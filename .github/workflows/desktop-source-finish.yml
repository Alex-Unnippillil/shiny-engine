name: Finalize reviewed desktop source
on:
  push:
    branches: ['feat/cross-platform-desktop']
permissions:
  contents: write
jobs:
  finish:
    if: >-
      github.event.head_commit.message == 'chore: finalize three checksum-bound desktop source edits'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Apply three exact reviewed edits on the feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/cross-platform-desktop'
          test "$(git rev-parse HEAD^)" = 'c0c656a18fccb7bc358a56bd050fa9e51a9a0422'
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def edit(path, before, after, pairs):
              p = Path(path)
              data = p.read_bytes()
              assert hashlib.sha256(data).hexdigest() == before, path
              text = data.decode('utf-8')
              for old, new in pairs:
                  assert text.count(old) == 1, (path, old)
                  text = text.replace(old, new, 1)
              data = text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == after, path
              p.write_bytes(data)
          edit('native/desktop/window.cpp', 'c87fe8d1af3c9572139bbff2d45acd0c219db4b174942a2acca014e9643469d5', '0774d10598b3aa8664628c2295e2ce8d911b122322ecb54a755695f3c2f22a12', [('auto* outer = newQVBoxLayout(central);', 'auto* outer = new QVBoxLayout(central);')])
          edit('README.md', 'eda100431a01963b2756e3ed606a13a2d68f0002acc068f8be5506364ab2ed42', 'bb362681116620d83519a0a420ab04cf56b2e5f9c5c657d4eda53070f2ff29e4', [
              ('### A local-first Windows workspace for watching, reviewing and comparing video.', '### Local-first desktop playback, review and comparison.\n\n**New: [Shiny Desktop for Windows, macOS and Ubuntu](native/desktop/README.md)** · [Cross-platform downloads](https://github.com/Alex-Unnippillil/shiny-engine/releases/tag/desktop-v0.1.0)\n\nThe **Qt Desktop edition** adds native installers and a local-media workflow across platforms. The **Windows VLC edition below** retains its advanced review, enhancement-library and research tools. These are separate editions, not feature-parity claims.'),
              ('Native macOS/Linux installers are not provided.', 'This VLC edition remains Windows-only. Use the [separate cross-platform Desktop edition](native/desktop/README.md) for macOS/Linux or a lighter Windows local-media workflow.'),
              ('| Windows desktop | **C++20, Win32, Common Controls, DWM** |', '| Cross-platform desktop edition | **C++20, Qt Widgets / Qt Multimedia** | Windows x64, macOS arm64/x64 and Ubuntu x64: `native/desktop`; separate player and version |\n| Windows desktop | **C++20, Win32, Common Controls, DWM** |')])
          p = Path('docs/implementation-status.md')
          data = p.read_bytes()
          assert hashlib.sha256(data).hexdigest() == '25e8bb0738c31868b90618f2622c2036c71ab1eed0457613280419b8683f423d'
          text = data.decode('utf-8').replace('# Implementation status — 0.10.0', '# Implementation status — Windows VLC 0.10.0 and Desktop 0.1.0\n\n## Additive cross-platform Desktop edition\n\n`native/desktop` implements a separate C++20 / Qt Widgets/Multimedia local-media player with Windows x64 Setup/ZIP, macOS arm64/x64 DMGs and Ubuntu 24.04 x64 DEB/TGZ packaging. It adds searchable queues, explicit atomic playlists/snapshots, transport/rate/repeat and embedded-track selection. It is not libVLC or a port of the Windows enhancement/model workers. The original Windows application and research/library plans remain unchanged.\n\nDistribution is prerelease: unsigned Windows, ad-hoc-only macOS (not Developer ID/notarized), and dependency-managed Ubuntu rather than a universal Linux binary. Four native-host install/playback/remove checks and the existing five application check names gate the independent `desktop-v0.1.0` release. Qt is dynamically linked; dependency notices, source access and payload hashes accompany packages. Read [the Desktop guide](../native/desktop/README.md) for its feature differences and installation requirements. Successful exact-commit reports, not source tests alone, establish which targets passed.', 1)
          text = text.replace('Code signing, native macOS/Linux installers, updater |', 'Code signing and updater; macOS/Linux installers now belong to the separate Qt Desktop edition above |')
          data = text.encode('utf-8')
          assert hashlib.sha256(data).hexdigest() == 'da1d5c43b5a5240d547fc585b9af1d3939a1bd5ee68a39e5714fc0fc1af6bc4e'
          p.write_bytes(data)
          PY
          git add -- native/desktop/window.cpp README.md docs/implementation-status.md
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finish desktop source and document separate native editions'
          git push origin HEAD:refs/heads/feat/cross-platform-desktop
