name: Apply reviewed portable launcher correction
on:
  push:
    branches: ['feat/optional-dlss-swapper']
permissions:
  contents: write
jobs:
  correction:
    if: >-
      github.event.head_commit.message == 'chore: apply reviewed portable launcher correction'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Apply exact reviewed source edits on feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/optional-dlss-swapper'
          test "$(git rev-parse HEAD^)" = '30ee553cf1af6ff671ceff00f6dc2a6a1a917dc6'
          python - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          encoded = ''
          decoder = zlib.decompressobj()
          raw = decoder.decompress(base64.b64decode(encoded, validate=True), 10000)
          assert decoder.eof and not decoder.unused_data and len(raw) == 5032
          assert hashlib.sha256(raw).hexdigest() == 'b05a110a4853251cb3dc5e8362b72b8630c85ea01d72b6089586851207cd85c0'
          rows = json.loads(raw)
          allowed = {'native/swapper/policy.hpp','native/swapper/service.hpp','native/swapper/service.cpp','native/swapper/dialog.cpp','tests/swapper/policy.cpp','tests/swapper/windows.cpp','docs/optional-swapper.md'}
          assert len(rows) == 7 and {r['path'] for r in rows} == allowed
          for row in rows:
              path = pathlib.Path(row['path'])
              assert path.is_file() and not path.is_symlink()
              old = path.read_bytes()
              assert hashlib.sha256(old).hexdigest() == row['before'], str(path)
              lines = old.decode('utf-8').splitlines(keepends=True)
              last = 0
              for start,end,text in row['changes']:
                  assert type(start) is int and type(end) is int and last <= start <= end <= len(lines) and isinstance(text,str)
                  last = end
              for start,end,text in reversed(row['changes']):
                  lines[start:end] = [text]
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == row['after'], str(path)
              path.write_bytes(new)
          PY
          git add -- native/swapper tests/swapper docs/optional-swapper.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: inspect portable launcher architectures and reset failed background work'
          git push origin HEAD:refs/heads/feat/optional-dlss-swapper
