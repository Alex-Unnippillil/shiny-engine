name: Browser and package
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: true
      - name: Archive exact source revision
        run: |
          git archive --format=zip -o shiny-engine-source.zip HEAD
          git -C third_party/opendlss-nr archive --format=zip -o ../../opendlss-source.zip HEAD LICENSE NOTICE ports/browser-webgpu/src ports/browser-webgpu/shaders
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-snapshot
          path: |
            shiny-engine-source.zip
            opendlss-source.zip
          if-no-files-found: error
  browser-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: python -m pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser and GPU integration tests
        timeout-minutes: 6
        env:
          DEBUG: pw:browser
          SHINY_GPU_HEADED: '1'
        run: |
          mkdir -p artifacts
          if xvfb-run -a npm run test:browser > artifacts/browser-test.log 2>&1; then
            tail -80 artifacts/browser-test.log
          else
            tail -100 artifacts/browser-test.log
            exit 1
          fi
      - run: python scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-build-and-evidence
          path: artifacts/
          if-no-files-found: warn
