name: Apply reviewed workspace corrections
on:
  push:
    branches: ['ui/workspace-readme']
permissions:
  contents: write
jobs:
  transfer:
    if: >-
      github.event.head_commit.message == 'chore: apply checksum-bound workspace corrections'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Update three exact source files on feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ui/workspace-readme'
          test "$(git rev-parse HEAD^)" = '1bc2060d92ff1a74077b4eb89ef5bd2447d7c2b7'
          python - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          encoded = ''
          decoder = zlib.decompressobj()
          raw = decoder.decompress(base64.b64decode(encoded, validate=True), 10000)
          assert decoder.eof and not decoder.unused_data and len(raw) == 4176
          assert hashlib.sha256(raw).hexdigest() == 'a07e86a57893e3c350b7ae28868e076d014ebede9eb4e3f7659b5b5167693b9c'
          rows = json.loads(raw)
          allowed = {'native/vlc-player/quick_actions.cpp','native/vlc-player/window.cpp','tests/vlc-player/workspace-ui.ps1'}
          assert len(rows) == 3 and {r['path'] for r in rows} == allowed
          for row in rows:
              path = pathlib.Path(row['path'])
              assert path.is_file() and not path.is_symlink()
              old = path.read_bytes()
              assert hashlib.sha256(old).hexdigest() == row['before'], str(path)
              lines = old.decode('utf-8').splitlines(keepends=True)
              last = 0
              for start,end,text in row['changes']:
                  assert type(start) is int and type(end) is int and last <= start <= end <= len(lines) and isinstance(text,str)
                  last = end
              for start,end,text in reversed(row['changes']):
                  lines[start:end] = [text]
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == row['after'], str(path)
              path.write_bytes(new)
          PY
          git add -- native/vlc-player/quick_actions.cpp native/vlc-player/window.cpp tests/vlc-player/workspace-ui.ps1
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: marshal UI test text and fit Quick actions to constrained work areas'
          git push origin HEAD:refs/heads/ui/workspace-readme
