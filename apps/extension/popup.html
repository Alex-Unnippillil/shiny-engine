<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shiny Engine</title><link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script></head>
<body>
<header><span class="mark" aria-hidden="true">S</span><div><h1>shiny<span>engine</span></h1><small>LOCAL MEDIA ENHANCEMENT</small></div><span class="version">0.5</span></header>
<p class="intro">A clearer view, on your device.</p>
<button id="lab" class="primary"><span>Open Media Lab<small>Images, videos, comparison &amp; export</small></span><span aria-hidden="true">↗</span></button>
<button id="player"><span>Windows VLC player<small>Native app · setup and build downloads</small></span><span aria-hidden="true">↗</span></button>
<button id="looklock"><span>Open LookLock<small>Review DLSS outputs · protect source details</small></span><span aria-hidden="true">↗</span></button>
<button id="neural"><span>Experimental Neural Lab<small>OpenDLSS-NR adapter · approved model required</small></span><span aria-hidden="true">↗</span></button>
<section aria-labelledby="tab-heading"><div class="heading"><h2 id="tab-heading">THIS TAB</h2><span id="current-tab">Checking page…</span></div>
<button id="inline" disabled><span>Enhance supported video<small>Readable HTML5 players with native controls</small></span><span aria-hidden="true">＋</span></button>
<button id="stop" class="subtle-button" disabled>Restore original video</button>
<div class="fallback"><button id="capture" disabled><span>Open tab in a separate viewer<small>Explicit capture permission required</small></span><span aria-hidden="true">↗</span></button><p>Player not supported? Try a separate viewer. Protected media may remain unavailable.</p></div></section>
<p id="status" role="status" aria-live="polite">No capture starts automatically.</p>
<footer>No uploads · Spatial filters are not DLSS</footer>
</body></html>
